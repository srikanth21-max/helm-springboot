name: ci-cd

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: srikanth7349/cicd-app

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Make a unique tag from the commit
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}

      - name: Write the new tag into the Helm values
        run: |
          sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" springboot-app/values-cicd.yaml
          grep -n "tag:" springboot-app/values-cicd.yaml

      - name: Commit the change back to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add springboot-app/values-cicd.yaml
          git commit -m "ci: update image tag to ${TAG}"
          git push