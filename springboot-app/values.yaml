replicaCount: 1

image:
  repository: srikanth7349/myapp
  tag: "3"
  pullPolicy: IfNotPresent

springProfile: dev
containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: app.local
  path: /
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  APP_ENVIRONMENT: "default"
  APP_GREETING: "Hello from default"
  LOGGING_LEVEL_ROOT: "INFO"

secret: {}

existingSecret: ""