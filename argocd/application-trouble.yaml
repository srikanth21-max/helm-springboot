apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-trouble
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/srikanth21-max/helm-springboot.git
    targetRevision: main
    path: springboot-app
    helm:
      valueFiles:
        - values-trouble.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: trouble-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true