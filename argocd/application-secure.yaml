apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-secure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srikanth21-max/helm-springboot.git
    targetRevision: main
    path: springboot-app
    helm:
      valueFiles:
        - values-secure.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true