apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-argo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srikanth21-max/helm-springboot.git
    targetRevision: main
    path: springboot-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true