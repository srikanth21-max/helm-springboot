apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/srikanth21-max/helm-springboot.git
    targetRevision: main
    path: springboot-app
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: replicaCount
          value: "1"

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true